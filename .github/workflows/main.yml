name: Build APK RTerp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Aceitar licenças do Android SDK pré-instalado
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Organizar estrutura, injetar chaves e compilar APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Encontra onde está o settings.gradle.kts ou settings.gradle
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -printf "%h\n" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Erro: settings.gradle não encontrado!"
            ls -la
            exit 1
          fi

          cd "$PROJECT_DIR"

          # Se a pasta 'app' não existir, mas a pasta 'src' estiver solta na raiz, organiza automaticamente
          if [ ! -d "app" ] && [ -d "src" ]; then
            echo "Organizando pasta src para dentro de app/..."
            mkdir -p app
            mv src app/
          fi

          # Injeta as chaves do Supabase
          echo "SUPABASE_URL=$SUPABASE_URL" > local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
          echo "SUPABASE_URL=$SUPABASE_URL" > .env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env

          # Compila o APK de Debug
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: 5. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: RTerp-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
